server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service

  # ── Postgres ────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:user_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:replace_with_a_unique_user_db_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never let Hibernate auto-generate DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  # ── Flyway ──────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis cache ─────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:replace_with_a_unique_redis_password}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes default TTL
      cache-null-values: false

  # ── Kafka (consumes identity events published by auth_service) ────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.userservice.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.userservice.event.AuthUserEvent

auth:
  jwt:
    secret: ${JWT_SECRET:replace_with_a_random_secret_at_least_32_bytes}
    issuer: ${JWT_ISSUER:auth-service}

app:
  kafka:
    topics:
      auth-user-events: auth.user.events

logging:
  level:
    com.example.userservice: INFO
    org.hibernate.SQL: WARN

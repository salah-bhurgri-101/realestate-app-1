spring:
  config:
    activate:
      on-profile: prod

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${AUTH_RL_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${AUTH_RL_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authServiceCB
                    fallbackUri: forward:/fallback/auth

            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${USER_RL_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${USER_RL_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: userServiceCB
                    fallbackUri: forward:/fallback/user

            - id: property-service
              uri: ${PROPERTY_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/properties/**,/api/favorites/**,/api/reviews/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${PROPERTY_RL_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${PROPERTY_RL_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: propertyServiceCB
                    fallbackUri: forward:/fallback/property

            - id: audit-service
              uri: ${AUDIT_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/audit-logs/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${AUDIT_RL_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${AUDIT_RL_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: auditServiceCB
                    fallbackUri: forward:/fallback/audit
          discovery:
            locator:
              enabled: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - X-Requested-With
                allowCredentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers RETAIN_FIRST
  webflux:
    problemdetails:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET must be set}
  issuer: ${JWT_ISSUER:auth-service}

resilience4j:
  circuitbreaker:
    instances:
      authServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      propertyServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      auditServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      userServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      authServiceCB:
        timeout-duration: 5s
      propertyServiceCB:
        timeout-duration: 5s
      auditServiceCB:
        timeout-duration: 5s
      userServiceCB:
        timeout-duration: 5s



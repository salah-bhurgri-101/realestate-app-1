server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: localhost:9092

  datasource:
    url: jdbc:mysql://localhost:3307/propertydb
    username: user
    password: change_me_property_db
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: change_me_redis
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          time-between-eviction-runs: 60000ms

jwt:
  secret: mySuperSecretKeyForJwtTokenGeneration123456789

audit:
  client:
    transport: kafka
    base-url: http://localhost:8084/
    kafka:
      topic: audit-events
    enabled: true
    timeout: 30s
    max-retries: 2
    retry-backoff: 200ms
    fail-silently: true

logging:
  level:
    com.realestate: DEBUG
server:
  port: ${SERVER_PORT:8082}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:propertydb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:replace_with_a_unique_property_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
#    open-in-view: false #(Becuase Of this open-in-view is false problem come) Resolved [org.hibernate.LazyInitializationException: Cannot lazily initialize collection of role 'com.realestate.property_service.entity.Property.images' with key '4d0fbb58-1aa2-4968-b68d-763be08f533a' (no session)]


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:replace_with_a_unique_redis_password}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 60000ms

jwt:
  secret: ${JWT_SECRET:replace_with_a_random_secret_at_least_32_bytes}
  issuer: ${JWT_ISSUER:auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

audit:
  client:
    transport: kafka
    base-url: ${AUDIT_BASE_URL:http://localhost:8084/}
    kafka:
      topic: audit-events
    enabled: true
    timeout: 30s
    max-retries: 2
    retry-backoff: 200ms
    fail-silently: true



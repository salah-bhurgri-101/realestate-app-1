<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Aurelia AWS EC2 Deployment Architecture</title>
  <desc id="desc">AWS VPC deployment diagram for the Aurelia real estate platform using Terraform and dedicated EC2 instances for services, databases, Redis, and Kafka.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#162f52"/>
    </linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13b981"/>
      <stop offset="1" stop-color="#42d9ac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#65d9ff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb84d"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #b8c8df; }
      .section { font: 700 19px Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .label { font: 700 17px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #9fb2cc; }
      .vpc { fill: #0b2344; stroke: #ff9900; stroke-width: 3; stroke-dasharray: 12 7; }
      .subnet-public { fill: #163d5e; stroke: #65d9ff; stroke-width: 2; }
      .subnet-private { fill: #173e3a; stroke: #42d9ac; stroke-width: 2; }
      .ec2 { fill: #1d4168; stroke: #65d9ff; stroke-width: 2; }
      .data { fill: #205345; stroke: #42d9ac; stroke-width: 2; }
      .cloud { fill: #382c4f; stroke: #b896ff; stroke-width: 2; }
      .line-blue { fill: none; stroke: #65d9ff; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-orange { fill: none; stroke: #ffb84d; stroke-width: 3; marker-end: url(#arrow-orange); }
      .line-dash { fill: none; stroke: #7792b2; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="240" fill="#ff9900" opacity=".08"/>
  <circle cx="130" cy="920" r="230" fill="#14b8a6" opacity=".08"/>

  <text x="66" y="64" class="title">AURELIA ON AWS</text>
  <text x="66" y="99" class="subtitle">EC2-only deployment • Terraform VPC • Docker Hub images • self-hosted data layer</text>
  <rect x="66" y="122" width="1468" height="4" rx="2" fill="url(#aws)"/>

  <rect x="66" y="153" width="280" height="108" rx="16" class="cloud" filter="url(#shadow)"/>
  <text x="206" y="190" text-anchor="middle" class="section">DELIVERY PIPELINE</text>
  <text x="206" y="219" text-anchor="middle" class="small">GitHub Actions</text>
  <text x="206" y="242" text-anchor="middle" class="small">Docker Hub • SHA image tags</text>

  <rect x="405" y="153" width="330" height="108" rx="16" class="cloud" filter="url(#shadow)"/>
  <text x="570" y="190" text-anchor="middle" class="section">INFRASTRUCTURE AS CODE</text>
  <text x="570" y="219" text-anchor="middle" class="small">Terraform</text>
  <text x="570" y="242" text-anchor="middle" class="small">VPC • subnets • EC2 • security groups</text>

  <rect x="794" y="153" width="740" height="108" rx="16" class="cloud" filter="url(#shadow)"/>
  <text x="1164" y="190" text-anchor="middle" class="section">AWS REGION</text>
  <text x="1164" y="219" text-anchor="middle" class="small">Internet Gateway → public entry points → internal VPC traffic</text>
  <text x="1164" y="242" text-anchor="middle" class="tiny">No RDS • no ElastiCache • no MSK • no ECS/EKS</text>

  <path d="M346 207 H398" class="line-orange"/>
  <path d="M737 207 H787" class="line-orange"/>

  <rect x="66" y="296" width="1468" height="625" rx="24" class="vpc" filter="url(#shadow)"/>
  <text x="98" y="335" class="section">AWS VPC 10.40.0.0/16</text>
  <text x="98" y="360" class="small">DNS hostnames enabled • private service traffic protected by internal security group</text>

  <rect x="98" y="386" width="1404" height="192" rx="18" class="subnet-public"/>
  <text x="128" y="422" class="section">PUBLIC SUBNETS</text>
  <text x="128" y="448" class="small">Internet Gateway • public IPs • HTTP/HTTPS ingress • SSH restricted to admin CIDR</text>

  <rect x="128" y="467" width="245" height="78" rx="12" class="ec2" filter="url(#shadow)"/>
  <text x="250" y="497" text-anchor="middle" class="label">EC2: FRONTEND</text>
  <text x="250" y="522" text-anchor="middle" class="small">Nginx • port 80/443</text>

  <rect x="402" y="467" width="245" height="78" rx="12" class="ec2" filter="url(#shadow)"/>
  <text x="524" y="497" text-anchor="middle" class="label">EC2: API GATEWAY</text>
  <text x="524" y="522" text-anchor="middle" class="small">Spring Cloud • port 8080</text>

  <rect x="676" y="467" width="245" height="78" rx="12" class="ec2" filter="url(#shadow)"/>
  <text x="798" y="497" text-anchor="middle" class="label">EC2: KAFKA</text>
  <text x="798" y="522" text-anchor="middle" class="small">Kafka broker • port 9092</text>

  <rect x="950" y="467" width="245" height="78" rx="12" class="ec2" filter="url(#shadow)"/>
  <text x="1072" y="497" text-anchor="middle" class="label">EC2: OPERATIONS</text>
  <text x="1072" y="522" text-anchor="middle" class="small">SSH • Docker • systemd</text>

  <rect x="1224" y="467" width="245" height="78" rx="12" class="ec2" filter="url(#shadow)"/>
  <text x="1346" y="497" text-anchor="middle" class="label">SECURITY GROUP</text>
  <text x="1346" y="522" text-anchor="middle" class="small">80/443 + admin SSH</text>

  <rect x="98" y="608" width="1404" height="282" rx="18" class="subnet-private"/>
  <text x="128" y="644" class="section">APPLICATION + DATA EC2 HOSTS</text>
  <text x="128" y="670" class="small">No managed AWS databases or application services • containers communicate over private VPC addresses</text>

  <rect x="128" y="692" width="230" height="78" rx="12" class="ec2"/>
  <text x="243" y="722" text-anchor="middle" class="label">AUTH SERVICE</text>
  <text x="243" y="747" text-anchor="middle" class="small">EC2 • :8081</text>

  <rect x="378" y="692" width="230" height="78" rx="12" class="ec2"/>
  <text x="493" y="722" text-anchor="middle" class="label">USER SERVICE</text>
  <text x="493" y="747" text-anchor="middle" class="small">EC2 • :8083</text>

  <rect x="628" y="692" width="230" height="78" rx="12" class="ec2"/>
  <text x="743" y="722" text-anchor="middle" class="label">PROPERTY SERVICE</text>
  <text x="743" y="747" text-anchor="middle" class="small">EC2 • :8082</text>

  <rect x="878" y="692" width="230" height="78" rx="12" class="ec2"/>
  <text x="993" y="722" text-anchor="middle" class="label">AUDIT SERVICE</text>
  <text x="993" y="747" text-anchor="middle" class="small">EC2 • :8084</text>

  <rect x="1128" y="692" width="160" height="78" rx="12" class="data"/>
  <text x="1208" y="722" text-anchor="middle" class="label">REDIS</text>
  <text x="1208" y="747" text-anchor="middle" class="small">EC2 cache</text>

  <rect x="1308" y="692" width="160" height="78" rx="12" class="data"/>
  <text x="1388" y="722" text-anchor="middle" class="label">DATABASES</text>
  <text x="1388" y="747" text-anchor="middle" class="small">EC2 containers</text>

  <rect x="128" y="795" width="230" height="65" rx="12" class="data"/>
  <text x="243" y="824" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="243" y="846" text-anchor="middle" class="tiny">auth • user • audit</text>

  <rect x="378" y="795" width="230" height="65" rx="12" class="data"/>
  <text x="493" y="824" text-anchor="middle" class="label">MySQL</text>
  <text x="493" y="846" text-anchor="middle" class="tiny">property database</text>

  <rect x="628" y="795" width="230" height="65" rx="12" class="data"/>
  <text x="743" y="824" text-anchor="middle" class="label">Kafka Topic</text>
  <text x="743" y="846" text-anchor="middle" class="tiny">auth.user.events</text>

  <rect x="878" y="795" width="230" height="65" rx="12" class="data"/>
  <text x="993" y="824" text-anchor="middle" class="label">Audit Events</text>
  <text x="993" y="846" text-anchor="middle" class="tiny">sync + async transport</text>

  <path d="M524 545 V680" class="line-blue"/>
  <path d="M524 545 C524 610 243 610 243 680" class="line-blue"/>
  <path d="M524 545 C524 610 743 610 743 680" class="line-blue"/>
  <path d="M524 545 C524 610 993 610 993 680" class="line-blue"/>
  <path d="M798 545 V680" class="line-orange"/>
  <path d="M798 545 C798 625 743 625 743 780" class="line-orange"/>

  <rect x="66" y="946" width="1468" height="30" rx="15" fill="#102442"/>
  <text x="800" y="967" text-anchor="middle" class="tiny">Aurelia principle: build once • push immutable Docker images • deploy to owned EC2 infrastructure</text>
</svg>

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: postgres
    password: change_me_auth_db
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: change_me_redis
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:?MAIL_USERNAME must be set}
    password: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

auth:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET must be set}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info, env, beans, mappings
  endpoint:
    health:
      show-details: always


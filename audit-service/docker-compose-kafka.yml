version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Single-broker Kafka in KRaft mode (no Zookeeper) for local development.
# Image: apache/kafka — the official Docker image maintained by Apache.
#
# Usage:
#   docker compose -f docker-compose-kafka.yml up -d
#
# Connecting from audit-service / any microservice:
#   spring.kafka.bootstrap-servers=localhost:9092
#   audit.client.transport=kafka
# ─────────────────────────────────────────────────────────────────────────────

services:

  kafka:
    image: apache/kafka:3.7.0          # Official Apache image — always exists, KRaft native
    container_name: audit-kafka
    ports:
      - "9092:9092"                     # Host access (microservices use this)
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "audit-local-cluster-00001"   # Fixed ID so data survives restarts

      # Listeners
      #  INTERNAL  → broker-to-broker inside docker network
      #  EXTERNAL  → what your Spring Boot apps on the host connect to
      #  CONTROLLER → KRaft controller
      KAFKA_LISTENERS:                     "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS:          "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME:    "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES:     "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS:      "1@kafka:9093"

      # Single-broker overrides (production would use ≥3 replicas)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:         1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:            1
      KAFKA_DEFAULT_REPLICATION_FACTOR:               1
      KAFKA_MIN_INSYNC_REPLICAS:                      1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:         0   # Faster startup for local dev

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Kafka UI ───────────────────────────────────────────────────────────────
  # Browse topics, messages, consumer groups at http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: audit-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:             local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # Uses INTERNAL listener inside docker network
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:

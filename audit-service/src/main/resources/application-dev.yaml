spring:
  datasource:
    url: jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      password: change_me_redis
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 60000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: mySuperSecretKeyForJwtTokenGeneration123456789   # dummy fallback OK for local dev

audit:
  kafka:
    topic: audit-events
    consumer-group: audit-service
    partitions: 3 # 1
    replicas: 1 # 1


logging:
  level:
    com.example.auditservice: INFO
    # ── Kafka consumer diagnostics ───────────────────────────────────────────
    # Set these to DEBUG temporarily if messages still don't appear after
    # the fix — they show exactly what the consumer is doing per poll cycle.
    org.springframework.kafka.listener: WARN
    org.springframework.kafka.support.serializer: WARN
    # Flip to DEBUG to see deserialization errors in detail:
    # org.springframework.kafka.support.serializer.ErrorHandlingDeserializer: DEBUG
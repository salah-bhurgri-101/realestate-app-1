spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auditdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:replace_with_a_unique_audit_db_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate     # no auto schema changes in prod — use Flyway/Liquibase
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false          # must be off in prod

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:replace_with_a_unique_redis_password}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 60000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # required — no localhost fallback in prod

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never     # tighter than dev's "when-authorized"

jwt:
  secret: ${JWT_SECRET:replace_with_a_random_secret_at_least_32_bytes}
  issuer: ${JWT_ISSUER:auth-service}

audit:
  kafka:
    topic: ${AUDIT_KAFKA_TOPIC:audit-events}
    consumer-group: audit-service
    partitions: ${AUDIT_KAFKA_PARTITIONS:3}
    replicas: ${AUDIT_KAFKA_REPLICAS:1}
#    replicas: ${AUDIT_KAFKA_REPLICAS:3}   # typically higher replica count in prod for durability


logging:
  level:
    com.example.auditservice: INFO
    # ── Kafka consumer diagnostics ──────────────────────────────────────────
    # Set these to DEBUG temporarily if messages still don't appear after
    # the fix — they show exactly what the consumer is doing per poll cycle.
    org.springframework.kafka.listener: WARN
    org.springframework.kafka.support.serializer: WARN
    # Flip to DEBUG to see deserialization errors in detail:
    # org.springframework.kafka.support.serializer.ErrorHandlingDeserializer: DEBUG

#    search problem per trace add kiya .
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: DEBUG